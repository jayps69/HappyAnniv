<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6d4d5">
  <title>Happy 6th Anniversary, Neeki ko ♡</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f6d4d5;
      overflow: hidden;
    }
    body { display: grid; place-items: center; }
    main {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
  </style>
</head>
<body>
  <main>
    <img
      src="./img/bg.png"
      alt="Happy 6th Anniversary, Neeki ko — cute chibi anime anniversary backdrop"
    >
  </main>
</body>
</html>
